# AENIMUS Compose stack v0.1.0
services:
  studio:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:${AENIMUS_UI_PORT:-18787}:8787"]
    env_file:
      - path: .env
        required: false
    environment:
      AENIMUS_HOST: 0.0.0.0
      AENIMUS_PORT: 8787
      AENIMUS_OLLAMA_URL: http://ollama:11434
      AENIMUS_QDRANT_URL: http://qdrant:6333
    volumes:
      - aenimus-data:/data
      - ./workspace:/workspace
    extra_hosts: ["host.docker.internal:host-gateway"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8787/api/health', timeout=3).raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      qdrant: {condition: service_started}
      ollama: {condition: service_started}
  ollama:
    image: ollama/ollama:0.11.4
    restart: unless-stopped
    volumes: ["ollama-data:/root/.ollama"]
    security_opt: ["no-new-privileges:true"]
  qdrant:
    image: qdrant/qdrant:v1.15.1
    restart: unless-stopped
    volumes: ["qdrant-data:/qdrant/storage"]
    security_opt: ["no-new-privileges:true"]
  discord:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.discord_bot"]
    env_file:
      - path: .env
        required: false
    environment: ["AENIMUS_API_URL=http://studio:8787/api"]
    depends_on:
      studio: {condition: service_started}
    profiles: ["discord"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  aenimus-data:
  ollama-data:
  qdrant-data:
