[project]
name = "aenimus-studio"
version = "0.1.0"
description = "Local-first multi-agent workflow studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "httpx>=0.27,<0.29",
  "pydantic-settings>=2.5,<2.11",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6,<7",
  "discord.py>=2.4,<3",
  "ruff>=0.9,<0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
